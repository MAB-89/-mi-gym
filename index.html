<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0e12"><link rel="manifest" href="./manifest.webmanifest"><title>Mi Gym</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0e12;color:#f5f7fa;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:env(safe-area-inset-top) 14px 120px}
.wrap{max-width:720px;margin:auto}.top{position:sticky;top:0;z-index:8;background:#0b0e12e8;backdrop-filter:blur(12px);padding:10px 0}.title{font-size:28px;font-weight:800}.muted,.meta{color:#aeb4bf}.tabs,.tools,.feel,.nav{display:flex;gap:10px}.tabs button,.tools button,.feel button,.nav button,.btn{border:1px solid #3a414c;background:#20252c;color:#fff;border-radius:14px;padding:13px;font-weight:700}.tabs button{flex:1}.tabs .on,.feel .on{background:#1688ff;border-color:#1688ff}.card{background:#171b20;border:1px solid #303640;border-radius:20px;padding:16px;margin:12px 0}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.name{font-size:22px;font-weight:800}.badge{background:#292f37;border-radius:13px;padding:10px 12px}.head,.set{display:grid;grid-template-columns:36px 1fr 1fr 58px;gap:10px;align-items:center}.head{color:#aeb4bf;text-align:center;margin-top:18px}.set{margin:10px 0}.set input,.note{width:100%;background:#0f1216;border:1px solid #3a414c;color:#fff;border-radius:14px;padding:15px;font-size:18px;text-align:center}.note{text-align:left;margin-top:10px}.check{height:54px;border-radius:50%;border:1px solid #4a515c;background:#292f37;color:#fff;font-size:19px;font-weight:800}.check.on{background:#1688ff}.feel button{flex:1;margin-top:8px}.tools{margin-top:12px}.tools button{flex:1}.panel{margin-top:12px;border:1px solid #343b45;border-radius:17px;padding:14px;background:#101419}.hidden{display:none!important}.visual{width:100%;height:220px;background:#e8e5df;border-radius:14px;overflow:hidden;margin:10px 0}.visual svg{width:100%;height:100%}.en{font-size:13px;font-weight:800;letter-spacing:1.2px;color:#b7bdc7}.how{line-height:1.45}.coreitem{border-top:1px solid #343b45;padding:12px 0}.coreitem:first-child{border-top:0}.progress{height:8px;background:#252b32;border-radius:8px;overflow:hidden;margin-top:10px}.progress>div{height:100%;background:#1688ff}.timer{position:fixed;left:14px;right:14px;bottom:14px;max-width:720px;margin:auto;background:#272c34;border:1px solid #414852;border-radius:22px;padding:13px 16px;display:flex;align-items:center;justify-content:space-between;z-index:10}.clock{font-size:32px;font-weight:800}.timer button{background:#3a414c;color:#fff;border:0;border-radius:13px;padding:13px 16px;font-weight:800}.section{font-size:13px;letter-spacing:2px;font-weight:800;color:#aeb4bf;margin:18px 4px 4px}.nav{margin:10px 0}.nav button{flex:1}.nav .on{background:#1688ff}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.big{font-size:30px;font-weight:800}.done{outline:1px solid #1688ff55}
@media(max-width:430px){.name{font-size:20px}.tools button{font-size:12px;padding:12px 7px}.visual{height:190px}}
</style></head><body><div class="wrap">
<div class="top"><div class="row"><div><div class="title">Mi Gym</div><div class="muted" id="date"></div></div><div id="pct">0%</div></div><div class="progress"><div id="bar"></div></div>
<div class="nav"><button class="on" onclick="view('train',this)">ENTRENAR</button><button onclick="view('hist',this)">HISTORIAL</button><button onclick="view('prog',this)">PROGRESO</button></div></div>
<section id="train"><div class="tabs"><button id="A" onclick="switchDay('A')">MARTES</button><button id="B" onclick="switchDay('B')">JUEVES</button></div>
<div class="section">CALENTAMIENTO</div><div id="warm"></div><div class="section">FUERZA · TREN SUPERIOR</div><div id="work"></div><div class="section">FINAL</div><div id="end"></div>
<button class="btn" style="width:100%;margin-top:12px" onclick="finish()">GUARDAR SESIÓN ✓</button></section>
<section id="hist" class="hidden"><div id="histbox"></div></section>
<section id="prog" class="hidden"><div class="stats"><div class="card"><div class="big" id="nsess">0</div><div class="muted">sesiones</div></div><div class="card"><div class="big" id="nsets">0</div><div class="muted">series</div></div></div><div id="loads"></div></section>
</div>
<div class="timer"><div><div class="muted">DESCANSO</div><div class="clock" id="clock">01:30</div></div><div><button onclick="resetT(60)">60 s</button> <button onclick="resetT(90)">90 s</button> <button id="play" onclick="toggleT()">▶</button></div></div>
<script>
const W=[["Movilidad articular","≈ 5 min"],["Elíptica inicial","15 min · suave/moderada"]],E=[["Elíptica final","15 min · moderada"]];
const R={A:[
["Press de pecho","CHEST PRESS","chest",3,"10–12",90,"Press de pecho con mancuernas","DUMBBELL BENCH PRESS","Ajusta el asiento para que las asas queden a la altura media del pecho. Espalda apoyada; empuja y vuelve con control."],
["Jalón al pecho","LAT PULLDOWN","lat",3,"10–12",90,"Pullover con mancuerna","DUMBBELL PULLOVER","Fija los muslos, mantén el pecho alto y lleva las asas hacia la parte superior del pecho sin balancearte."],
["Remo sentado","SEATED ROW","row",3,"10–12",90,"Remo con mancuerna a una mano","ONE-ARM DUMBBELL ROW","Torso estable. Lleva los codos atrás y controla el retorno."],
["Press de hombros","SHOULDER PRESS","shoulder",3,"10–12",90,"Press de hombros sentado con mancuernas","SEATED DUMBBELL SHOULDER PRESS","Espalda apoyada. Empuja por encima de la cabeza sin encoger los hombros."],
["Apertura de pectoral","PEC FLY","pec",3,"12–15",75,"Aperturas con mancuernas","DUMBBELL FLY","Cierra los brazos con control y evita llevar el hombro demasiado atrás."],
["Curl de bíceps","DEPENDENT ARM CURL","biceps",3,"10–12",60,"Curl de bíceps con mancuernas","DUMBBELL BICEPS CURL","Alinea los codos con el pivote y evita balancearte."],
["Press de tríceps","TRICEPS PRESS","triceps",3,"10–12",60,"Extensión de tríceps sobre la cabeza","OVERHEAD DUMBBELL TRICEPS EXTENSION","Mantén los codos controlados y evita ayudarte con el tronco."],
["Circuito core · Suelo","CORE · FLOOR","coreA",3,"1 vuelta",60,"","","3 vueltas"]
],B:[
["Press de pecho","CHEST PRESS","chest",3,"10–12",90,"Press de pecho con mancuernas","DUMBBELL BENCH PRESS","Ajusta el asiento para que las asas queden a la altura media del pecho. Espalda apoyada; empuja y vuelve con control."],
["Jalón al pecho","LAT PULLDOWN","lat",3,"10–12",90,"Pullover con mancuerna","DUMBBELL PULLOVER","Fija los muslos, mantén el pecho alto y evita el balanceo."],
["Remo sentado","SEATED ROW","row",3,"10–12",90,"Remo con mancuerna a una mano","ONE-ARM DUMBBELL ROW","Torso estable. Lleva el codo atrás y controla la vuelta."],
["Press de hombros","SHOULDER PRESS","shoulder",3,"10–12",90,"Press de hombros sentado con mancuernas","SEATED DUMBBELL SHOULDER PRESS","Espalda apoyada y hombros lejos de las orejas."],
["Deltoides posterior","REAR DELT","rear",3,"12–15",75,"Pájaros con mancuernas","DUMBBELL REVERSE FLY","Configura la máquina para deltoides posterior y abre los brazos con control."],
["Curl de bíceps","DEPENDENT ARM CURL","biceps",3,"10–12",60,"Curl de bíceps con mancuernas","DUMBBELL BICEPS CURL","Alinea los codos con el pivote y evita balancearte."],
["Press de tríceps","TRICEPS PRESS","triceps",3,"10–12",60,"Extensión de tríceps sobre la cabeza","OVERHEAD DUMBBELL TRICEPS EXTENSION","Mantén los codos controlados y evita ayudarte con el tronco."],
["Circuito core · Banco inclinado","CORE · INCLINE BENCH","coreB",3,"1 vuelta",60,"","","3 vueltas"]
]};
let day=localStorage.gymV2day||((new Date().getDay()==4)?"B":"A"),secs=90,running=false,tick;
const iso=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`},dk=()=>`gymV2draft-${iso()}-${day}`;
const get=()=>JSON.parse(localStorage.getItem(dk())||'{"sets":{},"checks":{},"notes":{},"feel":{}}'),put=s=>{localStorage.setItem(dk(),JSON.stringify(s));progress()};
const hist=()=>JSON.parse(localStorage.getItem("gymV2history")||"[]");
function machineSVG(k){let label={chest:"PRESS DE PECHO",lat:"JALÓN AL PECHO",row:"REMO SENTADO",shoulder:"PRESS HOMBROS",pec:"PEC FLY",rear:"REAR DELT",biceps:"CURL BÍCEPS",triceps:"PRESS TRÍCEPS"}[k]||"MÁQUINA";
return `<svg viewBox="0 0 600 300"><rect width="600" height="300" fill="#e8e5df"/><rect x="80" y="25" width="110" height="235" rx="15" fill="#30343a"/><rect x="105" y="48" width="60" height="145" rx="8" fill="#111"/><rect x="260" y="145" width="110" height="25" rx="10" fill="#34383d"/><rect x="285" y="78" width="65" height="80" rx="12" fill="#25292e"/><path d="M190 90 L300 135 M190 125 L300 150" stroke="#333" stroke-width="16" stroke-linecap="round"/><circle cx="190" cy="90" r="13" fill="#1688ff"/><text x="300" y="245" text-anchor="middle" font-size="25" font-weight="800" fill="#111">${label}</text><text x="300" y="275" text-anchor="middle" font-size="15" fill="#555">Referencia visual · busca este tipo de máquina</text></svg>`}
function altSVG(k){let lab={chest:"Press con mancuernas",lat:"Pullover",row:"Remo a una mano",shoulder:"Press de hombros",pec:"Aperturas",rear:"Pájaros",biceps:"Curl de bíceps",triceps:"Extensión de tríceps"}[k];
return `<svg viewBox="0 0 600 300"><rect width="600" height="300" fill="#e8e5df"/><rect x="155" y="215" width="290" height="20" rx="10" fill="#444"/><circle cx="300" cy="90" r="28" fill="#d2a37e"/><path d="M300 120 L300 205" stroke="#222" stroke-width="22" stroke-linecap="round"/><g class="arms"><path d="M292 140 L220 105 M308 140 L380 105" stroke="#222" stroke-width="18" stroke-linecap="round"/><circle cx="205" cy="98" r="18" fill="#111"/><circle cx="395" cy="98" r="18" fill="#111"/></g><path d="M290 200 L250 235 M310 200 L350 235" stroke="#222" stroke-width="18" stroke-linecap="round"/><path d="M205 70 Q205 35 245 35 M395 70 Q395 35 355 35" stroke="#1688ff" stroke-width="8" fill="none"/><text x="300" y="275" text-anchor="middle" font-size="23" font-weight="800" fill="#111">${lab}</text><style>.arms{transform-origin:300px 145px;animation:move 1.8s ease-in-out infinite alternate}@keyframes move{from{transform:rotate(0deg) scaleY(1)}to{transform:translateY(-28px) scaleY(.78)}}</style></svg>`}
function coreHTML(k){if(k==="coreA")return `<div class="coreitem"><b>1 · Plancha / PLANK</b><div>30 segundos</div></div><div class="coreitem"><b>2 · Escaladores / MOUNTAIN CLIMBERS</b><div>12 por pierna</div></div><div class="coreitem"><b>3 · Plancha arriba-abajo / UP-DOWN PLANK</b><div>12 repeticiones</div></div><p class="how">Completa los tres ejercicios y descansa 60 s. Repite 3 vueltas.</p>`;
return `<div class="coreitem"><b>1 · Elevación de piernas estiradas / INCLINE LEG RAISE</b><div>12 repeticiones</div></div><div class="coreitem"><b>2 · Rodillas al pecho / INCLINE KNEE RAISE</b><div>12 repeticiones</div></div><div class="coreitem"><b>3 · Abdominales en banco inclinado / INCLINE BENCH CRUNCH</b><div>12–15 repeticiones</div></div><p class="how">Completa los tres ejercicios y descansa 60 s. Repite 3 vueltas. En las elevaciones, acorta el recorrido si notas que la zona lumbar se arquea.</p>`}
function view(id,b){["train","hist","prog"].forEach(x=>document.getElementById(x).classList.toggle("hidden",x!==id));document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("on"));b.classList.add("on");if(id==="hist")renderHist();if(id==="prog")renderProg()}
function switchDay(d){day=d;localStorage.gymV2day=d;render()}
function previous(d,i){return hist().find(x=>x.day===d&&x.sets&&x.sets[i]&&x.sets[i].length)}
function render(){document.getElementById("date").textContent=new Intl.DateTimeFormat("es-ES",{weekday:"long",day:"numeric",month:"long"}).format(new Date());A.classList.toggle("on",day==="A");B.classList.toggle("on",day==="B");simple("warm",W,"w");simple("end",E,"e");let s=get(),b=document.getElementById("work");b.innerHTML="";
R[day].forEach((e,i)=>{let arr=s.sets[i]||[],done=arr.filter(x=>x&&x.done).length===e[3],p=previous(day,i),old=p?.sets?.[i]||[];
let rows=Array.from({length:e[3]},(_,j)=>{let q=arr[j]||{};return `<div class="set"><b>${j+1}</b><input inputmode="decimal" placeholder="${old[j]?.kg||'kg'}" value="${q.kg||''}" onchange="edit(${i},${j},'kg',this.value)"><input inputmode="numeric" placeholder="${old[j]?.reps||'reps'}" value="${q.reps||''}" onchange="edit(${i},${j},'reps',this.value)"><button class="check ${q.done?'on':''}" onclick="doneSet(${i},${j},${e[5]})">${q.done?'✓':j+1}</button></div>`}).join("");
let core=e[2].startsWith("core"),oldtxt=old.length?"Anterior: "+old.map(x=>(x.kg||"?")+" kg × "+(x.reps||"?")).join(" · "):"Sin registro anterior";
b.innerHTML+=`<div class="card ${done?'done':''}"><div class="row"><div><div class="name">${e[0]}</div><div class="meta">${e[1]} · ${e[3]} × ${e[4]}</div></div><div class="badge">${e[5]} s</div></div><div class="muted" style="margin-top:8px">${core?"3 vueltas":oldtxt}</div><div class="head"><span></span><span>${core?"VUELTA":"KG"}</span><span>${core?"":"REPS"}</span><span>✓</span></div>${rows}<div class="feel">${["Fácil","Bien","Difícil"].map(v=>`<button class="${s.feel[i]===v?'on':''}" onclick="feel(${i},'${v}')">${v}</button>`).join("")}</div><input class="note" placeholder="Nota opcional…" value="${s.notes[i]||''}" onchange="note(${i},this.value)">
<div class="tools">${core?`<button onclick="openOnly(${i},'m')">▶ VER CIRCUITO</button>`:`<button onclick="openOnly(${i},'m')">📷 VER MÁQUINA</button><button onclick="openOnly(${i},'a')">🔄 ALTERNATIVA</button>`}</div>
<div id="m${i}" class="panel hidden">${core?coreHTML(e[2]):`<b>${e[0]}</b><div class="en">${e[1]}</div><div class="visual">${machineSVG(e[2])}</div><p class="how"><b>Cómo hacerla:</b> ${e[8]}</p>`}</div>
${core?"":`<div id="a${i}" class="panel hidden"><b>${e[6]}</b><div class="en">${e[7]}</div><div class="visual">${altSVG(e[2])}</div><p class="how">Mantén las mismas 3 series y rango de repeticiones. Empieza con una carga cómoda y técnica estable.</p></div>`}</div>`});progress()}
function openOnly(i,t){let m=document.getElementById("m"+i),a=document.getElementById("a"+i),x=t==="m"?m:a,y=t==="m"?a:m;if(y)y.classList.add("hidden");if(x)x.classList.toggle("hidden")}
function simple(id,a,p){let s=get();document.getElementById(id).innerHTML=a.map((x,i)=>`<div class="card row"><div><div class="name">${x[0]}</div><div class="meta">${x[1]}</div></div><button class="check ${s.checks[p+i]?'on':''}" onclick="ck('${p+i}')">${s.checks[p+i]?'✓':''}</button></div>`).join("")}
function ck(k){let s=get();s.checks[k]=!s.checks[k];put(s);render()}function edit(i,j,k,v){let s=get();s.sets[i]=s.sets[i]||[];s.sets[i][j]=s.sets[i][j]||{};s.sets[i][j][k]=v;put(s)}
function doneSet(i,j,r){let s=get();s.sets[i]=s.sets[i]||[];s.sets[i][j]=s.sets[i][j]||{};s.sets[i][j].done=!s.sets[i][j].done;put(s);if(s.sets[i][j].done){resetT(r);startT()}render()}
function feel(i,v){let s=get();s.feel[i]=s.feel[i]===v?"":v;put(s);render()}function note(i,v){let s=get();s.notes[i]=v;put(s)}
function progress(){let s=get(),tot=R[day].reduce((a,e)=>a+e[3],0)+3,n=Object.values(s.sets).flat().filter(x=>x&&x.done).length+Object.values(s.checks).filter(Boolean).length,p=Math.round(n/tot*100);bar.style.width=Math.min(p,100)+"%";pct.textContent=p+"%"}
function finish(){let s=get(),h=hist(),n=Object.values(s.sets).flat().filter(x=>x&&x.done).length;if(!n&&!confirm("No hay series marcadas. ¿Guardar igualmente?"))return;h.unshift({id:Date.now(),date:new Date().toISOString(),day,sets:s.sets,checks:s.checks,notes:s.notes,feel:s.feel});localStorage.setItem("gymV2history",JSON.stringify(h.slice(0,100)));localStorage.removeItem(dk());alert("Sesión guardada 💪");render()}
function renderHist(){let h=hist();histbox.innerHTML=h.length?h.map(x=>`<div class="card"><div class="row"><div><div class="name">${x.day==="A"?"Martes":"Jueves"}</div><div class="meta">${new Intl.DateTimeFormat("es-ES",{day:"numeric",month:"long",year:"numeric"}).format(new Date(x.date))}</div></div><div class="badge">${Object.values(x.sets||{}).flat().filter(q=>q&&q.done).length} series</div></div></div>`).join(""):'<div class="card muted">Todavía no hay sesiones guardadas.</div>'}
function renderProg(){let h=hist();nsess.textContent=h.length;nsets.textContent=h.reduce((a,x)=>a+Object.values(x.sets||{}).flat().filter(q=>q&&q.done).length,0);loads.innerHTML='<div class="card muted">Tus cargas anteriores aparecen directamente como referencia dentro de cada ejercicio.</div>'}
function resetT(n){secs=n;running=false;clearInterval(tick);drawT()}function drawT(){clock.textContent=String(Math.floor(secs/60)).padStart(2,"0")+":"+String(secs%60).padStart(2,"0");play.textContent=running?"Ⅱ":"▶"}
function startT(){running=true;clearInterval(tick);tick=setInterval(()=>{if(secs<=0){clearInterval(tick);running=false;if(navigator.vibrate)navigator.vibrate([200,100,200]);drawT();return}secs--;drawT()},1000);drawT()}function toggleT(){running?(running=false,clearInterval(tick),drawT()):startT()}
render();drawT();if("serviceWorker"in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
</script></body></html>

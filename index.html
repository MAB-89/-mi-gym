<style>
:root{--bg:#0e0f11;--card:#191b1f;--soft:#25282e;--line:#343840;--txt:#f6f6f6;--muted:#a8adb7;--accent:#d7ff32}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:680px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 14px calc(105px + env(safe-area-inset-bottom))}
h1{margin:0;font-size:29px}.muted,.tiny{color:var(--muted)}.tiny{font-size:12px}
header,.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.nav,.days{display:grid;gap:8px;margin:13px 0}.nav{grid-template-columns:repeat(3,1fr)}.days{grid-template-columns:1fr 1fr}
button{font:inherit}.btn{border:0;border-radius:14px;padding:12px;background:var(--soft);color:white;font-weight:800}.active,.primary{background:var(--accent)!important;color:#111!important}
.progress{height:8px;background:#292c31;border-radius:9px;overflow:hidden}.bar{height:100%;background:var(--accent);width:0}
.section{margin:21px 2px 8px;font-size:12px;letter-spacing:.12em;font-weight:900;color:var(--muted)}
.card{background:var(--card);border:1px solid #2b2e34;border-radius:18px;padding:14px;margin:9px 0}.card.done{border-color:#58712f}
.name{font-size:18px;font-weight:850}.meta{font-size:13px;color:var(--muted);margin-top:3px}.badge{font-size:12px;background:#292d33;padding:6px 8px;border-radius:10px}
.gridhead,.setrow{display:grid;grid-template-columns:34px 1fr 1fr 46px;gap:7px;align-items:center}.gridhead{font-size:11px;color:var(--muted);text-align:center;margin-top:12px}
.setrow{margin-top:7px}.inp{min-width:0;width:100%;background:#111317;border:1px solid var(--line);border-radius:10px;padding:9px 4px;color:white;text-align:center;font-size:16px}
.check,.setcheck{border:1px solid #41454d;background:#272a30;color:white;border-radius:50%;font-weight:900}.check{width:34px;height:34px}.setcheck{width:42px;height:42px}.on{background:var(--accent)!important;color:#111!important;border-color:var(--accent)!important}
.feel{display:flex;gap:6px;margin-top:10px}.feel button{flex:1;border:1px solid #3b3f46;background:#25282d;color:#ddd;border-radius:10px;padding:8px;font-size:12px}
.note{width:100%;margin-top:9px;background:#111317;border:1px solid var(--line);border-radius:10px;padding:9px;color:white}.hidden{display:none!important}
.big{width:100%;margin-top:12px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat{background:var(--card);padding:14px;border-radius:16px}.num{font-size:27px;font-weight:900}
details{margin-top:9px;color:var(--muted);font-size:13px}summary{color:#ddd}
.timer{position:fixed;z-index:20;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));width:min(650px,calc(100% - 28px));background:#23262b;border:1px solid #3a3e45;border-radius:18px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 8px 30px #0009}
.time{font-size:24px;font-weight:900}.timer button{border:0;border-radius:10px;background:#383c43;color:white;padding:9px;font-weight:800}

.machinePhoto{width:100%;max-height:360px;object-fit:cover;border-radius:14px;margin-top:10px;border:1px solid #343840}
.en{font-size:11px;letter-spacing:.08em;color:var(--muted);font-weight:800;margin-top:2px}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}
.tools button{border:1px solid #3b3f46;background:#25282d;color:#eee;border-radius:10px;padding:9px;font-weight:750;font-size:12px}
.infoBox{margin-top:9px;background:#111317;border:1px solid #343840;border-radius:12px;padding:10px;font-size:13px;line-height:1.4}
.coregrid{display:grid;gap:7px;margin-top:10px}.coreitem{background:#111317;border:1px solid #343840;border-radius:12px;padding:10px}

.visual{position:relative;height:220px;margin-top:10px;border:1px solid #343840;border-radius:14px;overflow:hidden;background:linear-gradient(180deg,#20242a,#101216)}
.visual svg{width:100%;height:100%;display:block}.visualTitle{position:absolute;left:10px;top:9px;background:#0d0f12dd;padding:6px 9px;border-radius:9px;font-size:11px;font-weight:900;letter-spacing:.05em}
.motion{animation:move 1.45s ease-in-out infinite alternate;transform-origin:center}
@keyframes move{from{transform:translate(0,0)}to{transform:translate(0,-13px)}}
.motionX{animation:moveX 1.35s ease-in-out infinite alternate;transform-origin:center}
@keyframes moveX{from{transform:translateX(-13px)}to{transform:translateX(13px)}}

.motionCaption{font-size:12px;color:#c9ced6;padding:7px 10px 9px;text-align:center;background:#11151a}
.clearVisual{height:auto}.clearVisual svg{height:230px;background:radial-gradient(circle at 50% 45%,#262b32,#121519 70%)}

.photoGuide{margin-top:10px;border:1px solid #343840;border-radius:16px;overflow:hidden;background:#101419}
.photoGuide img{width:100%;height:auto;display:block;object-fit:contain;background:#0b1015}
.photoGuide .cap{padding:10px 12px;color:#d7dde6;font-size:13px;line-height:1.35}
.twoStep{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.step{background:#171b20;border:1px solid #343840;border-radius:12px;padding:10px}
.step b{display:block;margin-bottom:4px}.arrowTxt{color:#d7ff32;font-weight:900}

.exerciseGuide{margin-top:10px;border-radius:15px;overflow:hidden;border:1px solid #36404b;background:#0b1015}
.exerciseGuide img{width:100%;height:auto;display:block}
.exerciseGuide .tip{padding:10px 12px;font-size:13px;line-height:1.35;color:#d9dee6}
@media(max-width:430px){.exerciseGuide{margin-left:-2px;margin-right:-2px}.exerciseGuide .tip{font-size:12px}}

function coreVisual(kind){
 if(kind==="coreB") return photoGuide("photo-core-bench.jpg","CORE · BANCO INCLINADO","Completa los 3 ejercicios y descansa 60 s.")+`<div class="coregrid"><div class="coreitem"><b>Elevación de piernas estiradas</b><div class="en">INCLINE LEG RAISE</div>12 repeticiones</div><div class="coreitem"><b>Rodillas al pecho</b><div class="en">INCLINE KNEE RAISE</div>12 repeticiones</div><div class="coreitem"><b>Abdominales en banco inclinado</b><div class="en">INCLINE BENCH CRUNCH</div>12–15 repeticiones</div></div>`;
 return photoGuide("photo-core-floor.jpg","CORE · SUELO","Completa los 3 ejercicios y descansa 60 s.")+`<div class="coregrid"><div class="coreitem"><b>Plancha</b><div class="en">PLANK</div>30 segundos</div><div class="coreitem"><b>Escaladores</b><div class="en">MOUNTAIN CLIMBERS</div>12 por pierna</div><div class="coreitem"><b>Plancha arriba-abajo</b><div class="en">UP-DOWN PLANK</div>12 repeticiones</div></div>`;
}
function render(){document.getElementById("date").textContent=new Intl.DateTimeFormat("es-ES",{weekday:"long",day:"numeric",month:"long"}).format(new Date());document.getElementById("dayA").classList.toggle("active",day==="A");document.getElementById("dayB").classList.toggle("active",day==="B");checks("warm",W,"w");checks("end",E,"e");let s=get(),b=document.getElementById("work");b.innerHTML="";
R[day].forEach((e,i)=>{let arr=s.sets[i]||[],done=arr.filter(x=>x&&x.done).length===e[3],p=previous(day,i),old=p?.sets?.[i]||[];let rows=Array.from({length:e[3]},(_,j)=>{let q=arr[j]||{};return `<div class="setrow"><b>${j+1}</b><input class="inp" inputmode="decimal" placeholder="${old[j]?.kg||'kg'}" value="${q.kg||''}" onchange="edit(${i},${j},'kg',this.value)"><input class="inp" inputmode="numeric" placeholder="${old[j]?.reps||'reps'}" value="${q.reps||''}" onchange="edit(${i},${j},'reps',this.value)"><button class="setcheck ${q.done?'on':''}" onclick="done(${i},${j},${e[5]})">${q.done?'✓':j+1}</button></div>`}).join("");
let oldtxt=old.length?"Anterior: "+old.map(x=>(x.kg||"?")+" kg × "+(x.reps||"?")).join(" · "):"Sin registro anterior";
b.innerHTML+=`<div class="card ${done?'done':''}"><div class="row"><div><div class="name">${e[0]}</div><div class="meta">${e[1]} · ${e[3]} × ${e[4]}</div></div><div class="badge">${e[5]} s</div></div><div class="tiny" style="margin-top:8px">${oldtxt}</div><div class="gridhead"><span></span><span>KG</span><span>REPS</span><span>✓</span></div>${rows}<div class="feel">${["Fácil","Bien","Difícil"].map(v=>`<button class="${s.feel[i]===v?'on':''}" onclick="setFeel(${i},'${v}')">${v}</button>`).join("")}</div><input class="note" placeholder="Nota opcional…" value="${s.notes[i]||''}" onchange="setNote(${i},this.value)"><div class="tools"><button onclick="toggleBox('m-${day}-${i}')">📷 VER MÁQUINA</button><button onclick="toggleBox('a-${day}-${i}')">🔄 ALTERNATIVA</button></div>
<div id="m-${day}-${i}" class="infoBox hidden">${e[6].startsWith("core")?coreVisualV6(e[6]):bestMachineV6((e[0]==="Deltoides posterior"?"rear":e[6]),e[1])+`<p><b>Cómo hacerla:</b> ${e[9]}</p>`}</div>
<div id="a-${day}-${i}" class="infoBox hidden">${e[7]?`<b>${e[7]}</b><div class="en">${e[8]}</div>${bestAltV6((e[0]==="Deltoides posterior"?"rear":e[6]),e[8])}<p><b>Movimiento:</b> sigue las flechas verdes y vuelve despacio a la posición inicial.</p><p class="muted">Haz las mismas 3 series y rango de repeticiones.</p>`:`${coreVisualV6(e[6])}`}</div></div>`});progress()}
function checks(id,a,p){let s=get(),b=document.getElementById(id);b.innerHTML=a.map((x,i)=>`<div class="card row"><div><div class="name">${x[0]}</div><div class="meta">${x[1]}</div></div><button class="check ${s.checks[p+i]?'on':''}" onclick="ck('${p+i}')">${s.checks[p+i]?'✓':''}</button></div>`).join("")}
function ck(k){let s=get();s.checks[k]=!s.checks[k];put(s);render()}function edit(i,j,k,v){let s=get();s.sets[i]=s.sets[i]||[];s.sets[i][j]=s.sets[i][j]||{};s.sets[i][j][k]=v;put(s)}
function done(i,j,r){let s=get();s.sets[i]=s.sets[i]||[];s.sets[i][j]=s.sets[i][j]||{};s.sets[i][j].done=!s.sets[i][j].done;put(s);if(s.sets[i][j].done){resetT(r);startT()}render()}
function setFeel(i,v){let s=get();s.feel[i]=s.feel[i]===v?"":v;put(s);render()}function setNote(i,v){let s=get();s.notes[i]=v;put(s)}
function progress(){let s=get(),tot=R[day].reduce((a,e)=>a+e[3],0)+3,n=Object.values(s.sets).flat().filter(x=>x&&x.done).length+Object.values(s.checks).filter(Boolean).length,p=Math.round(n/tot*100);document.getElementById("bar").style.width=Math.min(p,100)+"%";document.getElementById("pct").textContent=p+"%"}
function finish(){let s=get(),h=hist(),n=Object.values(s.sets).flat().filter(x=>x&&x.done).length;if(!n&&!confirm("No hay series marcadas. ¿Guardar igualmente?"))return;h.unshift({id:Date.now(),date:new Date().toISOString(),day,sets:s.sets,checks:s.checks,notes:s.notes,feel:s.feel});localStorage.setItem("gymV2history",JSON.stringify(h.slice(0,100)));localStorage.removeItem(dk());alert("Sesión guardada 💪");render()}
function renderHist(){let h=hist(),b=document.getElementById("histbox");b.innerHTML=h.length?h.map(x=>`<div class="card"><div class="row"><div><div class="name">${x.day==="A"?"Martes · A":"Jueves · B"}</div><div class="meta">${new Intl.DateTimeFormat("es-ES",{day:"numeric",month:"long",year:"numeric"}).format(new Date(x.date))}</div></div><div class="badge">${Object.values(x.sets||{}).flat().filter(q=>q&&q.done).length} series</div></div></div>`).join(""):'<div class="card muted">Todavía no hay sesiones guardadas.</div>'}
function renderProg(){let h=hist();document.getElementById("nsess").textContent=h.length;document.getElementById("nsets").textContent=h.reduce((a,x)=>a+Object.values(x.sets||{}).flat().filter(q=>q&&q.done).length,0);let out=[];["A","B"].forEach(d=>R[d].forEach((e,i)=>{let p=previous(d,i),a=p?.sets?.[i]?.filter(x=>x&&x.kg)||[];if(a.length)out.push(`<div class="card"><div class="name">${e[0]}</div><div class="meta">${d==="A"?"Martes":"Jueves"} · ${a.map(x=>x.kg).join(" / ")} kg</div></div>`)}));document.getElementById("loads").innerHTML=out.join("")||'<div class="card muted">Guarda tu primera sesión para empezar a ver datos.</div>'}
function toggleBox(id){
 const target=document.getElementById(id); if(!target)return;
 const prefix=id.startsWith("m-")?"a-":"m-";
 const other=document.getElementById(prefix+id.slice(2));
 if(other)other.classList.add("hidden");
 target.classList.toggle("hidden");
}
function resetT(n){secs=n;running=false;clearInterval(tick);drawT()}function drawT(){document.getElementById("clock").textContent=String(Math.floor(secs/60)).padStart(2,"0")+":"+String(secs%60).padStart(2,"0");document.getElementById("play").textContent=running?"Ⅱ":"▶"}
function startT(){running=true;clearInterval(tick);tick=setInterval(()=>{if(secs<=0){clearInterval(tick);running=false;if(navigator.vibrate)navigator.vibrate([200,100,200]);drawT();return}secs--;drawT()},1000);drawT()}function toggleT(){running?(running=false,clearInterval(tick),drawT()):startT()}
render();drawT();if("serviceWorker"in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
